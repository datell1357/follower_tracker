name: Native checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-and-capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: >-
          ./gradlew :core:test :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
          :app:assembleDebugAndroidTest :app:assembleRelease :app:lintRelease --no-daemon
        working-directory: android
      - run: node --test shared/tests/capture.test.cjs
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: swift test --package-path ios/FollowerCore
      - run: |
          python3 ios/scripts/generate_project.py
          git diff --exit-code -- ios/FollowerTracker.xcodeproj
      - run: >-
          xcodebuild -project ios/FollowerTracker.xcodeproj -scheme FollowerTracker
          -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/follower-ios" -jobs 2 CODE_SIGNING_ALLOWED=NO build
